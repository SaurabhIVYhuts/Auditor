name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database that exists only during the CI run. Not a real secret.
          POSTGRES_USER: auditor_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: auditor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditor_app -d auditor_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://auditor_app:ci_only_password@localhost:5432/auditor_db
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build database from migrations
        run: python -m alembic upgrade head

      - name: Check models match migrations
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
